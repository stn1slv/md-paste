name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint and vet (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2.x needs action @v8 or later. The pinned version
          # must be a binary built with go1.26 to match go.mod; v2.12.1
          # satisfies that. Bump as new releases ship.
          version: v2.12.1
          args: --timeout=5m

      # The Windows backend is pure Go (no CGO), so it can be vetted and
      # linted from Linux. Without this, *_windows.go files are never checked.
      - name: go vet (windows)
        run: go vet ./...
        env:
          GOOS: windows

      - name: golangci-lint (windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.12.1
          args: --timeout=5m

  lint-darwin:
    name: Lint (macOS, CGO)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # The darwin backend uses CGO, so it must be linted on macOS.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          args: --timeout=5m

  test-cross-platform:
    name: Tests (ubuntu, stub clipboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu
          path: coverage.out

  test-windows:
    name: Tests (Windows, pure-Go clipboard)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  test-darwin:
    name: Tests (macOS, CGO + E2E)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go build
        run: make build

      - name: go test (with E2E)
        run: make test-integration
